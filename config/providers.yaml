llm:
  # Cursor SDK agent；文本推理统一使用 grok-4.6
  kind: cursor_sdk
  model: Qwen/Qwen3.5-9B
  sdk_model: grok-4.6
  sdk_params: ["effort=high"]
  sdk_fallback: ""
  sdk_fallback_params: []
  sdk_mode: agent
  sdk_retries: 3
  sdk_timeout: 900

vl:
  # Cursor SDK 负责视觉理解；ASR/OCR/口播情绪仍走本地专用模型
  kind: cursor_sdk
  model: Qwen/Qwen3-VL-8B-Instruct
  sdk_model: grok-4.6
  sdk_params: ["effort=high"]
  sdk_fallback: ""
  sdk_fallback_params: []
  sdk_mode: agent
  sdk_retries: 3
  sdk_timeout: 900

comfy:
  base_url: "http://127.0.0.1:8188"

t2i:
  kind: openai_compat
  base_url: ""
  api_key: ""
  model: ""
