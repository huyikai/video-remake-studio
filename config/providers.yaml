llm:
  # cursor_sdk = Cursor SDK 本地 agent；transformers = 本机 Qwen3.5-9B
  kind: cursor_sdk
  model: Qwen/Qwen3.5-9B
  # 拆段是纯推理，弱模型在相邻候选之间会随机摇摆；composer-2.5 每跑一次结果都不同。
  sdk_model: grok-4.6
  sdk_params: ["effort=high"]
  # 主模型连着失败时换的兜底（内容安全拒答是确定性的，重试同一个没用，换族才有用）
  sdk_fallback: claude-opus-5
  sdk_fallback_params: ["thinking=true", "effort=high"]
  sdk_mode: agent
  sdk_retries: 3
  # Pass B 带 6 张单帧、effort=high，单次要三五分钟；180s 会让主模型每段都超时白烧
  sdk_timeout: 900
  # api_key 优先读环境变量 CURSOR_API_KEY；要写死就填 config/local.yaml

vl:
  kind: transformers
  model: Qwen/Qwen3-VL-8B-Instruct

comfy:
  base_url: "http://127.0.0.1:8188"

t2i:
  kind: openai_compat
  base_url: ""
  api_key: ""
  model: ""
